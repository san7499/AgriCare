{% extends "base.html" %}
{% block content %}

<style>

/* BACKGROUND */
body {
  background: linear-gradient(135deg, #e8f5e9, #f1f8f4);
}

/* WRAPPER */
.signup-wrapper {
  min-height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CARD */
.signup-card {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(14px);
  border-radius: 20px;
  padding: 40px;
  width: 100%;
  max-width: 450px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.1);
  animation: slideUp 0.8s ease;
}

/* TITLE */
.signup-title {
  text-align: center;
  font-weight: 700;
  color: #2e7d32;
  margin-bottom: 25px;
}

/* INPUT GROUP */
.form-group {
  position: relative;
  margin-bottom: 20px;
}

.form-control, .form-select {
  border-radius: 30px;
  padding: 14px 18px;
  border: 1px solid #ddd;
  transition: 0.3s;
}

.form-control:focus, .form-select:focus {
  border-color: #2e7d32;
  box-shadow: 0 0 10px rgba(46,125,50,0.2);
}

/* PASSWORD TOGGLE */
.password-toggle {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #777;
}

/* BUTTON */
.btn-signup {
  background: linear-gradient(135deg, #43a047, #2e7d32);
  border: none;
  border-radius: 30px;
  padding: 12px;
  font-weight: 600;
  transition: 0.3s;
}

.btn-signup:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.2);
}

/* LOADING */
.btn-loading {
  opacity: 0.7;
  pointer-events: none;
}

/* LINK */
.login-link {
  color: #2e7d32;
  font-weight: 600;
  text-decoration: none;
}
.login-link:hover {
  text-decoration: underline;
}

/* ANIMATION */
@keyframes slideUp {
  from {opacity:0; transform: translateY(40px);}
  to {opacity:1; transform: translateY(0);}
}

</style>

<div class="signup-wrapper">

  <div class="signup-card">

    <h2 class="signup-title">🌿 Create AgriCare Account</h2>

    <form method="POST" id="signupForm">

      <!-- USERNAME -->
      <div class="form-group">
        <input type="text" name="username"
               class="form-control"
               placeholder="Username"
               required>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <input type="password" name="password" id="password"
               class="form-control"
               placeholder="Password"
               required>
        <span class="password-toggle" onclick="togglePassword()">👁️</span>
      </div>

      <!-- ROLE -->
      <div class="form-group">
        <select name="role" class="form-select" required>
          <option value="">Select Role</option>
          <option value="user">👨‍🌾 Farmer / User</option>
          <option value="shop">🏪 Shop Keeper</option>
        </select>
      </div>

      <!-- BUTTON -->
      <button type="submit" id="signupBtn" class="btn btn-signup w-100">
        Sign Up
      </button>

    </form>

    <hr class="my-4">

    <p class="text-center mb-0">
      Already have an account?
      <a href="{{ url_for('login') }}" class="login-link">
        Login here
      </a>
    </p>

  </div>

</div>

<script>

/* PASSWORD TOGGLE */
function togglePassword() {
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}

/* BUTTON LOADING */
document.getElementById("signupForm").addEventListener("submit", function () {
  const btn = document.getElementById("signupBtn");
  btn.innerHTML = "Creating Account...";
  btn.classList.add("btn-loading");
});

</script>

{% endblock %}
