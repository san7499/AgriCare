{% extends "base.html" %}
{% block content %}

<style>

/* BACKGROUND */
body {
  background: linear-gradient(135deg, #e8f5e9, #f1f8f4);
}

/* WRAPPER */
.form-wrapper {
  min-height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* GLASS CARD */
.form-card {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  padding: 35px;
  width: 100%;
  max-width: 450px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.1);
  animation: fadeUp 0.8s ease;
}

/* TITLE */
.form-title {
  text-align: center;
  font-weight: 700;
  color: #2e7d32;
  margin-bottom: 25px;
}

/* INPUT */
.form-control {
  border-radius: 30px;
  padding: 14px 18px;
  border: 1px solid #ddd;
  transition: 0.3s;
}

textarea.form-control {
  border-radius: 15px;
}

.form-control:focus {
  border-color: #2e7d32;
  box-shadow: 0 0 10px rgba(46,125,50,0.2);
}

/* BUTTON */
.btn-submit {
  background: linear-gradient(135deg, #43a047, #2e7d32);
  border: none;
  border-radius: 30px;
  padding: 12px;
  font-weight: 600;
  transition: 0.3s;
}

.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.2);
}

/* LOADING */
.btn-loading {
  opacity: 0.7;
  pointer-events: none;
}

/* LOCATION BOX */
.location-box {
  background: #f1f8e9;
  border-radius: 12px;
  padding: 10px;
  font-size: 14px;
  text-align: center;
}

/* ANIMATION */
@keyframes fadeUp {
  from {opacity:0; transform: translateY(30px);}
  to {opacity:1; transform: translateY(0);}
}

</style>

<div class="form-wrapper">

  <div class="form-card">

    <h4 class="form-title">🏪 Add Shop Details</h4>

    <form method="POST" id="shopForm">

      <!-- SHOP NAME -->
      <div class="mb-3">
        <input type="text" name="shop_name"
               class="form-control"
               placeholder="Shop Name"
               required>
      </div>

      <!-- PHONE -->
      <div class="mb-3">
        <input type="text" name="phone"
               class="form-control"
               placeholder="Contact Number"
               required>
      </div>

      <!-- ADDRESS -->
      <div class="mb-3">
        <textarea name="address"
                  class="form-control"
                  rows="3"
                  placeholder="Shop Address"
                  required></textarea>
      </div>

      <!-- HIDDEN LOCATION -->
      <input type="hidden" name="latitude" id="latitude">
      <input type="hidden" name="longitude" id="longitude">

      <!-- LOCATION STATUS -->
      <div id="locationStatus" class="location-box mb-3 text-muted">
        📍 Fetching location...
      </div>

      <!-- BUTTON -->
      <button type="submit" id="submitBtn"
              class="btn btn-submit w-100">
        Save Shop Details
      </button>

    </form>

  </div>

</div>

<script>

/* LOCATION */
document.addEventListener("DOMContentLoaded", function () {

  const latInput = document.getElementById("latitude");
  const lngInput = document.getElementById("longitude");
  const status = document.getElementById("locationStatus");

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function (position) {
        latInput.value = position.coords.latitude;
        lngInput.value = position.coords.longitude;

        status.innerHTML = "✅ Location captured successfully";
        status.classList.remove("text-muted");
        status.classList.add("text-success");
      },
      function () {
        status.innerHTML = "❌ Location access denied";
        status.classList.remove("text-muted");
        status.classList.add("text-danger");
      }
    );
  } else {
    status.innerHTML = "❌ Geolocation not supported";
    status.classList.add("text-danger");
  }

});

/* BUTTON LOADING */
document.getElementById("shopForm").addEventListener("submit", function () {
  const btn = document.getElementById("submitBtn");
  btn.innerHTML = "Saving...";
  btn.classList.add("btn-loading");
});

</script>

{% endblock %}
